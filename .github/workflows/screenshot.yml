# Screenshot the app in a cloud Android emulator, so Miku can SEE it herself.
# Triggered only manually (workflow_dispatch) — never on push, so this
# never triggers the APK build. It downloads the already-built build-3 APK
# artifact (run 42990700978), installs it on an API 34 emulator, launches
# the app, and captures screenshots as an artifact.
name: Screenshot in emulator

on:
  workflow_dispatch:

jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - name: Download build-3 APK artifact
        uses: actions/download-artifact@v4
        with:
          name: liquid-glass-navbar-release-apk
          run-id: 42990700978
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apk

      - name: Run emulator and screenshot the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r apk/app-release.apk
            adb shell am start -n com.liquidglass.navbar/.MainActivity
            sleep 10
            adb shell screencap -p /sdcard/shot_10s.png
            adb pull /sdcard/shot_10s.png ./shot_10s.png
            sleep 8
            adb shell screencap -p /sdcard/shot_18s.png
            adb pull /sdcard/shot_18s.png ./shot_18s.png
            ls -la *.png

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshots
          path: shot_*.png
