# Screenshot the app in a cloud Android emulator, so Miku can SEE it herself.
# Triggered only manually (workflow_dispatch) — never on push, so this
# never triggers the phone APK build. This builds the app from source for
# x86_64 ONLY (the emulator is x86_64; the arm64-only phone APK cannot
# install on it — INSTALL_FAILED_NO_MATCHING_ABIS). The x86_64 APK is a
# test artifact for the emulator only; Haziq's phone still uses the arm64
# build-3 APK. Then it installs the x86_64 APK on an API 34 emulator,
# launches the app, and captures screenshots as an artifact.
name: Screenshot in emulator

on:
  workflow_dispatch:

jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --clean

      - name: Build for x86_64 (emulator test only)
        run: printf '\nreactNativeArchitectures=x86_64\n' >> android/gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build release APK (x86_64)
        run: cd android && ./gradlew assembleRelease --no-daemon -x lint

      - name: Upload x86_64 APK (for Appetize, even if the emulator fails)
        uses: actions/upload-artifact@v4
        with:
          name: app-x86_64
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Run emulator and screenshot the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          boot-timeout: 1200
          emulator-options: -no-snapshot -wipe-data -noaudio -no-boot-anim
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb shell am start -n com.liquidglass.navbar/.MainActivity
            sleep 10
            adb shell screencap -p /sdcard/shot_10s.png
            adb pull /sdcard/shot_10s.png ./shot_10s.png
            sleep 8
            adb shell screencap -p /sdcard/shot_18s.png
            adb pull /sdcard/shot_18s.png ./shot_18s.png
            ls -la *.png

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshots
          path: shot_*.png
